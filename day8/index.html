<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../setting/reset.css" />
    <link rel="stylesheet" href="root.css" />
    <link rel="stylesheet" href="font.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="reservation.css" />
    <link rel="stylesheet" href="promotion.css" />
    <link rel="stylesheet" href="member-event.css" />
    <link rel="stylesheet" href="location.css" />
    <link rel="stylesheet" href="footer.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <header>
      <nav>
        <ul class="left">
          <li>
            <img
              src="https://www.socar.kr/_next/static/media/logo-pc.f9a75156.svg"
              alt=""
            />
          </li>
          <li>예약하기</li>
          <li>쏘카 서비스</li>
          <li>블로그</li>
        </ul>
        <ul class="rigth">
          <li>로그인</li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="reservation">
        <div class="contents">
          <h3 class="title">차가 필요할땐, 쏘카</h3>
          <div class="search">
            <div class="calendar">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-calendar-check-icon lucide-calendar-check"
              >
                <path d="M8 2v3" />
                <path d="M16 2v3" />
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M3 9h18" />
                <path d="m9 15 2 2 4-4" />
              </svg>
              <span>오늘 14:30 ~ 18:30</span>
            </div>
            <div class="search-bar">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-search-icon lucide-search"
              >
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
              <input type="text" placeholder="대여 장소 검색" />
            </div>
            <button>검색</button>
          </div>
        </div>
      </section>
      <section class="promotion"></section>
      <section class="member-event"></section>
      <section class="location"></section>
    </main>
    <footer></footer>
  </body>
</html>
